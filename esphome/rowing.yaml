# Example ESPHome configuration for rowing_monitor (ESP32 — adjust pins and wifi).
substitutions:
  friendly_name: "Rower Monitor"

# Node name "rower" so default HA object ids become sensor.rower_spm, sensor.rower_distance, etc.
esphome:
  name: rower
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  password: ""
  homeassistant_services: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Rower Hotspot"
    password: "rower-hotspot"

captive_portal:

external_components:
  - source:
      type: local
      path: ../components
    components: [rowing_monitor]

sensor:
  - platform: rowing_monitor
    id: row_core
    step1_pin:
      number: GPIO18
      mode:
        input: true
        pullup: false
      inverted: false
    step2_pin:
      number: GPIO19
      mode:
        input: true
        pullup: false
      inverted: false
    reset_pin:
      number: GPIO23
      mode:
        input: true
        pullup: true
      inverted: true
    spm_sensor:
      name: "SPM"
      id: rower_spm
    distance_sensor:
      name: "Distance"
      id: rower_distance
    total_strokes_sensor:
      name: "Total Strokes"
      id: rower_total_strokes
    active_time_sensor:
      name: "Active Time"
      id: rower_active_time
    uptime_sensor:
      name: "Uptime"
      id: rower_uptime
    valid_strokes_sensor:
      name: "Valid Strokes"
      id: rower_valid_strokes
    short_strokes_sensor:
      name: "Short Strokes"
      id: rower_short_strokes
    micro_strokes_sensor:
      name: "Micro Strokes"
      id: rower_micro_strokes
